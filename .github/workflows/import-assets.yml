name: Import portfolio assets
on:
  push:
    paths: ['.github/workflows/import-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import images and PDF from the existing public portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --output 'assets/page-13.webp' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/page-13.webp'
          curl --fail --location --retry 3 --output 'assets/page-12.webp' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/page-12.webp'
