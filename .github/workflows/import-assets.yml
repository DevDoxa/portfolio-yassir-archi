          curl --fail --location --retry 3 --output 'assets/page-21.webp' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/page-21.webp'
          curl --fail --location --retry 3 --output 'assets/figuig.webp' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/figuig.webp'
          curl --fail --location --retry 3 --output 'assets/page-5.webp' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/page-5.webp'
