          curl --fail --location --retry 3 --output 'assets/page-11.webp' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/page-11.webp'
          curl --fail --location --retry 3 --output 'assets/yassir-boukhdimi-portfolio.pdf' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/yassir-boukhdimi-portfolio.pdf'
          curl --fail --location --retry 3 --output 'assets/page-10.webp' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/page-10.webp'
          curl --fail --location --retry 3 --output 'assets/page-3.webp' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/page-3.webp'
          curl --fail --location --retry 3 --output 'assets/page-17.webp' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/page-17.webp'
          python - <<'PY'
          from pathlib import Path
          for p in Path('assets').glob('*'):
              data = p.read_bytes()
              if p.suffix == '.webp':
                  assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', p
              elif p.suffix == '.pdf':
                  assert data.startswith(b'%PDF-'), p
          PY
      - name: Commit imported files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Import portfolio images and PDF"
            git push
          fi
