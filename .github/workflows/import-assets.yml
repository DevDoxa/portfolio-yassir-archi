          curl --fail --location --retry 3 --output 'assets/page-25.webp' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/page-25.webp'
          curl --fail --location --retry 3 --output 'assets/village.webp' 'https://yassir-boukhdimi-architecture.grittyapple1.chatgpt.site/assets/village.webp'
